[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-client"
version = "0.1.0"
description = "自包含 LLM 客户端库：provider 目录 / 无状态 Client / 有状态 ConversationSession（无项目依赖）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml",
]

# 自动发现子包。曾经这里是 packages = ["llm_client"] —— 显式列举不会递归带上
# 子包，于是 llm_client.agent 在非 editable 安装时整个丢失（wheel 里没有 agent/），
# 而 chat/app.py 是模块级 from llm_client.agent import run_agent_turn，
# 后果是普通安装后 chat 服务直接起不来。改成 find 后新增子包不必再回来改这里。
[tool.setuptools.packages.find]
include = ["llm_client*"]

[tool.setuptools.package-data]
llm_client = ["providers.yaml"]
