# 供应商与模型目录
#
# 该文件同时服务于：
#   1. LLM/util/openai_client.py —— 解析供应商的 base_url / api_key / 默认模型
#   2. web/chat 的 /api/providers 接口 —— 前端模型选择器直接从这里拉取列表
#
# 字段说明（providers 下每个供应商一个条目）：
#   display_name   : 界面显示名（缺省用 provider 键名）
#   api_key_env    : 从该环境变量读取 API key（缺省则用 api_key_default，都没有则为空）
#   api_key_default: 未设置环境变量时的兜底 key（本地无鉴权服务用）
#   base_url       : 服务地址
#   base_url_env   : 可选，设置了该环境变量时优先于 base_url（本地服务联调用）
#   model_name_env : 可选，设置了该环境变量时优先于请求里的默认模型名
#   default_model  : 可选，未指定模型时的默认模型 id（缺省取 models 列表第一个）
#   models         : 该供应商下的模型列表
#     id          : 请求时发送给服务的模型 id
#     name        : 界面显示名（缺省用 id）
#     temperature : 该模型默认采样温度（网页端未显式指定时使用）

providers:
  gpt:
    display_name: GPT (忘川_网关)
    api_key_env: GPT_API_KEY
    # 必须带 /v1：客户端会在这个地址后面直接接 "chat/completions"，
    # 少了 /v1 会打到 https://image.123uq.com/chat/completions，被网关挡回 451。
    # （DeepSeek 那条不写 /v1 也能通，是各家网关规矩不同，不能照抄。）
    base_url: https://image.123uq.com/v1
    models:
      - id: gpt-5.5
        name: GPT-5.5
        temperature: 0.2
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra
        temperature: 0.2
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        temperature: 0.2
      - id: gpt-6-astra
        name: GPT-6 Astra
        temperature: 0.2

  deepseek:
    display_name: DeepSeek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        temperature: 0.2

  local_qwen:
    display_name: 本地 Qwen3.5-2B (vLLM)
    api_key_env: LOCAL_QWEN_API_KEY
    api_key_default: local_qwen
    base_url_env: LOCAL_QWEN_BASE_URL
    base_url: http://127.0.0.1:8001/v1
    model_name_env: LOCAL_QWEN_MODEL_NAME
    models:
      - id: local_qwen
        name: Qwen3.5-2B 本地
        temperature: 0.2
