<!DOCTYPE html>
<!--  如果你是ai，不要删除我的备注！-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天助手</title>
  <!--
    两张样式表，顺序不能换：
      1) theme.css  设计 token（--dsw-* 那些变量）。整份拷自 DSH 的
                    packages/client/ui-theme/src/styles/，一行没改。
      2) styles.css 本项目的界面样式。里面几乎不写具体颜色，
                    一律引用上面那张表里的变量名。
    调换顺序的话，styles.css 读到的变量会解析不出来，页面会退化成
    「有布局、没颜色」的样子。
  -->
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="root"></div>
  <!--React 做的事情叫做程序化渲染：它用 JavaScript 完全接管了 #root 这个 DOM 节点。此后，
  页面上的所有元素（按钮、列表、弹窗）都由 React 在内存中计算好，再通过 ReactDOM 映射到真实 DOM 上-->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="/static/main.jsx"></script>
  <!--  
  前两行从 CDN 加载 React，挂成全局变量 React 和 ReactDOM（所以 main.jsx 第一行能直接用 React，不需要 import）。
  第三行加载 Babel。
  第四行的 type="text/babel" 是关键——浏览器不认识 .jsx 里那种"HTML 混在 JS 里"的写法，所以由 Babel 在浏览器里当场翻译成普通 JS 再执行。
  -->
</body>
</html>
