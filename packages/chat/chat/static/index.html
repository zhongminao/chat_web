<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天助手</title>
  <!--
    两张样式表顺序不能换：theme.css 是设计 token（--dsw-* 那些变量），
    styles.css 只用变量名不写具体颜色。调换顺序会让变量解析不出来，
    页面退化成「有布局、没颜色」。

    样式刻意不参与构建：theme.css 是 DSH 上游的逐字拷贝，保持 <link> 原样，
    它「升级时整份覆盖」的性质才不会被内联破坏。
  -->
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="root"></div>
  <!-- 由 esbuild 从 frontend/src/ 打包而来，见 frontend/package.json -->
  <script src="/static/app.js"></script>
</body>
</html>
