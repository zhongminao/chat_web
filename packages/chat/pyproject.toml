[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat"
version = "0.1.0"
description = "AI 聊天助手：React + FastAPI，后端通过 chat-agent 调用 LLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "chat-agent",
]

[tool.setuptools]
packages = ["chat"]

[tool.setuptools.package-data]
chat = ["static/*"]
